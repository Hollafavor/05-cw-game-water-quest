<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="brand-header">
      <img class="brand-logo" src="img/cw_logo_horizontal.png" alt="charity: water">
      <p>Clean water changes everything</p>
    </header>
    <main>
      <h1>Water Quest</h1>
      <p class="game-instructions">Collect 20 items to complete the game!</p>
      <div class="stats">
        <p>Score: <span id="current-cans">0</span></p>
        <p>Time Left: <span id="timer">30</span>s</p>
      </div>
      <div id="achievements" class="achievement" aria-live="polite"></div>
      <div class="game-grid"></div>
      <div class="game-controls">
        <button id="start-game">Start Game</button>
        <button id="reset-game" type="button">Reset</button>
      </div>
    </main>
  </div>
  <div id="confetti" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
